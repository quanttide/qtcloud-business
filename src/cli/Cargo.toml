[package]
name = "qtcloud-business-cli"
version = "0.1.0"
edition = "2024"
description = "QtCloud Business CLI — 商务拓展总览与报价计算"

[[bin]]
name = "qtcloud-business"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
